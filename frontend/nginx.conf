# Сайт Mini App (TASK-123): готовые файлы + /api → контейнер api (как proxy в vite.config.ts)
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Адрес api ищем при каждом запросе (DNS Docker): после пересборки у api новый IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Фото до 15 МБ (MAX_PHOTO_BODY_BYTES), перевод и AI-ответы — до минуты
        client_max_body_size 16m;
        proxy_read_timeout 120s;
    }

    # Имена файлов с хешем меняются при каждой сборке — кэшируем навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Страница всегда свежая: после обновления Telegram сразу берёт новые файлы
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
