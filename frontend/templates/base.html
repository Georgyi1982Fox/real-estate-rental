<!doctype html>
<html lang="{{ lang|default('ka') }}" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" id="theme-color-meta" content="#F8FAFC">
    <meta name="description" content="Bina.ai — Telegram Mini App for apartment rentals in Georgia">
    <title>{% block title %}Bina.ai{% endblock %}</title>

    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'Noto Sans Georgian', 'system-ui', 'sans-serif']
              }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">

    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="https://unpkg.com/alpinejs@3.17.4/dist/cdn.min.js" defer></script>
    <script src="{{ url_for('static', path='js/telegram.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/utils.js') }}" defer></script>
  </head>
  <body class="min-h-screen bg-[var(--background)] text-[var(--text-primary)] antialiased">
    <header class="app-header border-b border-[var(--border)] bg-[var(--surface)]/90 backdrop-blur-md">
      {% include 'components/header.html' %}
    </header>

    <main id="main-content" class="app-main mx-auto w-full max-w-screen-xl px-4 pb-24 pt-4 sm:px-6 lg:px-8">
      {% block content %}{% endblock %}
    </main>

    <footer class="app-footer border-t border-[var(--border)] bg-[var(--surface)]">
      {% include 'components/footer.html' %}
    </footer>

    <div id="toast-region" class="pointer-events-none fixed inset-x-4 bottom-[calc(1rem+env(safe-area-inset-bottom))] z-50 mx-auto max-w-md" aria-live="polite"></div>
  </body>
</html>
