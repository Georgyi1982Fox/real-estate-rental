<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bina.ai — Listing Card Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #ef4444;
        --background: #f8fafc;
        --surface: #ffffff;
        --surface-hover: #f1f5f9;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --border: #e2e8f0;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        --radius-lg: 16px;
      }

      body {
        margin: 0;
        min-width: 0;
        overflow-x: hidden;
        background: var(--background);
        color: var(--text-primary);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      .prototype-card {
        transition: transform 200ms ease, box-shadow 200ms ease;
      }

      .prototype-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .prototype-card__image {
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0f172a;
          --surface: #1e293b;
          --surface-hover: #334155;
          --text-primary: #f8fafc;
          --text-secondary: #cbd5e1;
          --border: #334155;
        }
      }
    </style>
  </head>

  <body>
    <main class="min-h-screen px-4 py-8 sm:px-6 lg:px-8">
      <section class="mx-auto w-full max-w-6xl" aria-labelledby="prototype-title">
        <header class="mb-6">
          <p class="text-sm font-medium text-[var(--primary)]">Bina.ai / FRONTEND-002</p>
          <h1 id="prototype-title" class="mt-1 text-2xl font-bold">Listing Card Prototype</h1>
          <p class="mt-2 text-sm text-[var(--text-secondary)]">
            Визуальный референс компонента карточки квартиры.
          </p>
        </header>

        <section aria-label="Карточка квартиры" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
          <article
            x-data="{ isFavorite: false }"
            class="prototype-card group w-full max-w-full overflow-hidden rounded-[var(--radius-lg)] border border-[var(--border)] bg-[var(--surface)] shadow-[var(--shadow-sm)]"
          >
            <figure class="m-0">
              <div class="relative aspect-[4/3] w-full overflow-hidden bg-[var(--surface-hover)]">
                <img
                  class="prototype-card__image h-full w-full transition-transform duration-300 group-hover:scale-[1.02]"
                  src="https://via.placeholder.com/400x300/2563EB/FFFFFF?text=Photo+1"
                  alt="Квартира в Сабуртало"
                  loading="lazy"
                  width="400"
                  height="300"
                />

                <button
                  type="button"
                  class="absolute right-3 top-3 inline-flex min-h-11 min-w-11 items-center justify-center rounded-full border border-white/60 bg-white/90 text-[var(--text-secondary)] shadow-sm backdrop-blur-sm transition-colors duration-200 hover:bg-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)] focus-visible:ring-offset-2"
                  :class="isFavorite ? 'text-[var(--danger)]' : 'text-[var(--text-secondary)]'"
                  :aria-pressed="isFavorite"
                  aria-label="Добавить квартиру в избранное"
                  @click="isFavorite = !isFavorite"
                >
                  <span class="text-xl leading-none" aria-hidden="true">♥</span>
                </button>
              </div>

              <figcaption class="space-y-3 p-4">
                <header>
                  <h2 class="break-words text-base font-semibold leading-6">Квартира в Сабуртало</h2>
                  <p class="mt-1 text-lg font-bold leading-6">1 200 ₾</p>
                </header>

                <p class="flex items-center gap-2 text-sm text-[var(--text-secondary)]">
                  <span aria-hidden="true">📍</span>
                  <span>Сабуртало</span>
                </p>

                <dl class="grid grid-cols-2 gap-3 border-t border-[var(--border)] pt-3 text-sm text-[var(--text-secondary)]">
                  <div>
                    <dt class="sr-only">Комнаты</dt>
                    <dd><span class="font-medium text-[var(--text-primary)]">2</span> комн.</dd>
                  </div>
                  <div class="text-right">
                    <dt class="sr-only">Площадь</dt>
                    <dd><span class="font-medium text-[var(--text-primary)]">65</span> м²</dd>
                  </div>
                </dl>
              </figcaption>
            </figure>
          </article>
        </section>
      </section>
    </main>
  </body>
</html>
