name: CI

# Проверки на каждый PR и на каждый пуш в develop (TASK-040).
# Бэкенд: ruff (линтер и форматирование), mypy, pytest (unit + интеграционные на PostgreSQL + pgvector).
# Фронтенд: проверка типов TypeScript и сборка.
# Docker: docker-compose.yml валиден, образ бэкенда собирается (TASK-039).
on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Интеграционные тесты очищают эту базу (см. tests/integration/conftest.py)
      BINA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bina_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format)
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src tests

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (tsc, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker (compose config, image build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose config
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/' .env
          docker compose config -q

      - name: Build backend image
        run: docker build -t bina-backend:ci .

      - name: Image entry points
        run: |
          docker run --rm bina-backend:ci bina-api --help
          docker run --rm bina-backend:ci bina-bot --help
          docker run --rm bina-backend:ci bina-scrape --help
          docker run --rm bina-backend:ci alembic --help
